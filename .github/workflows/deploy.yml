name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_USE_MOCK_FALLBACK: "false"
          VITE_APPWRITE_ENDPOINT: "https://cloud.appwrite.io/v1"
          VITE_APPWRITE_PROJECT_ID: "6a9e9053003be1fde2dc"
          VITE_APPWRITE_DATABASE_ID: "my_library_db"
          VITE_APPWRITE_COLLECTION_PROFILES: "user_profiles"
          VITE_APPWRITE_COLLECTION_BOOKS: "books"
          VITE_APPWRITE_COLLECTION_READING_STATES: "reading_states"
          VITE_APPWRITE_COLLECTION_CERTIFICATES: "certificates"
          VITE_APPWRITE_COLLECTION_PROJECTS: "projects"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
